<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบทำบัตรนักศึกษา MGMU</title>
  
  <!-- ไลบรารีสำหรับแปลง บัตร เป็น รูปภาพ PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Sarabun', 'Segoe UI', sans-serif; }
    body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; color: #f8fafc; }
    .container { display: flex; gap: 40px; flex-wrap: wrap; background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); align-items: flex-start; }
    
    /* ฝั่ง Form กรอกข้อมูล */
    .form-section { flex: 1; min-width: 300px; }
    .form-section h2 { color: #f59e0b; margin-top: 0; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #cbd5e1; font-size: 13px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #475569; background-color: #0f172a; color: white; border-radius: 6px; font-size: 14px; }
    .form-group input:focus { border-color: #f59e0b; outline: none; }
    
    /* ช่องเวลาห้ามแก้ไข */
    .form-group input[readonly] {
      background-color: #334155;
      color: #94a3b8;
      cursor: not-allowed;
      border-color: #334155;
    }

    .btn-download { width: 100%; padding: 14px; background-color: #f59e0b; color: #0b192c; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s; margin-top: 15px; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3); }
    .btn-download:hover { background-color: #d97706; }

    /* ฝั่งบัตรนักศึกษา */
    .preview-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    #student-card {
      width: 350px;
      height: 540px;
      background: linear-gradient(180deg, #091322 0%, #112238 100%);
      border-radius: 16px;
      padding: 20px;
      color: white;
      position: relative;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      border: 3px solid #d97706;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header + โลโก้มุมขวาบน */
    .card-header-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5px;
      margin-bottom: 8px;
    }
    .header-title {
      color: #f59e0b;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }
    .card-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .card-divider {
      height: 2px;
      background-color: #f59e0b;
      margin-bottom: 15px;
      width: 100%;
    }

    .card-body { text-align: center; flex: 1; }
    
    .avatar-box {
      width: 115px;
      height: 145px;
      border-radius: 10px;
      margin: 0 auto 12px auto;
      overflow: hidden;
      background-color: #1e293b;
    }
    .avatar-box img { width: 100%; height: 100%; object-fit: cover; }

    .student-name { font-size: 18px; font-weight: bold; color: #ffffff; margin-bottom: 4px; }
    .student-id { font-size: 16px; color: #f59e0b; font-weight: bold; letter-spacing: 1px; margin-bottom: 14px; }
    
    .info-group { text-align: left; font-size: 13px; background: rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { color: #94a3b8; }
    .info-val { color: #ffffff; font-weight: 500; }
    .status-highlight { color: #4ade80; font-weight: bold; }

    /* พื้นที่แสดง QR Code ด้านล่าง */
    .qr-section {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding-left: 10px;
      margin-top: auto;
      margin-bottom: 20px;
    }
    .qr-box {
      background: white;
      padding: 6px;
      border-radius: 6px;
      display: inline-block;
      line-height: 0;
    }

    .card-footer {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ฝั่งกรอกข้อมูล -->
  <div class="form-section">
    <h2>กรอกข้อมูลบัตรนักศึกษา</h2>
    
    <div class="form-group">
      <label>รูปถ่ายนักศึกษา:</label>
      <input type="file" id="input-photo" accept="image/*" onchange="previewImage(event)">
    </div>
    
    <div class="form-group">
      <label>ชื่อ-นามสกุล:</label>
      <input type="text" id="input-name" value="นายศุภเสกข์ วรรณศรี" oninput="updateCard()">
    </div>
    
    <div class="form-group">
      <label>รหัสนักศึกษา:</label>
      <input type="text" id="input-id" value="31012569" oninput="updateCard()">
    </div>
    
    <div class="form-group">
      <label>คณะ / สาขาวิชา:</label>
      <input type="text" id="input-faculty" value="แพทยศาสตร์" oninput="updateCard()">
    </div>
    
    <div class="form-group">
      <label>ระดับการศึกษา:</label>
      <input type="text" id="input-degree" value="ปริญญาเอก" oninput="updateCard()">
    </div>

    <div class="form-group">
      <label>สถานะนักศึกษา:</label>
      <input type="text" id="input-status" value="นักศึกษาปกติ" oninput="updateCard()">
    </div>

    <div class="form-group">
      <label>เวลาที่ออกบัตร (ล็อกอัตโนมัติ - แก้ไขไม่ได้):</label>
      <input type="text" id="input-issue-time" readonly>
    </div>

    <button class="btn-download" onclick="downloadCard()">💾 บันทึกบัตรเป็นรูปภาพ (PNG)</button>
  </div>

  <!-- ฝั่งแสดงบัตร (Live Preview) -->
  <div class="preview-section">
    <div id="student-card">
      
      <!-- ส่วน Header + โลโก้มุมขวาบน -->
      <div class="card-header-wrapper">
        <div class="header-title">MGMU UNIVERSITY</div>
        <img src="mgmu.png" alt="Logo" class="card-logo" onerror="this.style.opacity='0.3'">
      </div>
      <div class="card-divider"></div>
      
      <!-- ส่วน Body ข้อมูลนักศึกษา -->
      <div class="card-body">
        <div class="avatar-box">
          <img id="card-img" src="https://via.placeholder.com/115x145?text=PHOTO" alt="Student Photo">
        </div>
        <div class="student-name" id="card-name">นายศุภเสกข์ วรรณศรี</div>
        <div class="student-id" id="card-id">31012569</div>
        
        <div class="info-group">
          <div class="info-row"><span class="info-label">คณะ:</span><span class="info-val" id="card-faculty">แพทยศาสตร์</span></div>
          <div class="info-row"><span class="info-label">ระดับ:</span><span class="info-val" id="card-degree">ปริญญาเอก</span></div>
          <div class="info-row"><span class="info-label">สถานะ:</span><span class="info-val status-highlight" id="card-status">นักศึกษาปกติ</span></div>
        </div>
      </div>
      
      <!-- ส่วนแสดง QR Code Canvas -->
      <div class="qr-section">
        <div class="qr-box">
          <canvas id="qrcode-canvas"></canvas>
        </div>
      </div>

      <!-- Footer -->
      <div class="card-footer">
        บัตรประจำตัวนักศึกษา | STUDENT ID CARD
      </div>
    </div>
  </div>
</div>

<script>
  /* =========================================================
     SimpleQR Engine (แก้ไขระบบ Lock พื้นที่ Finder Pattern 7x7)
  ========================================================= */
  const SimpleQR = (function() {
    function QRCode(typeNumber) {
      this.typeNumber = typeNumber;
      this.modules = null;
      this.reserved = null;
      this.moduleCount = 0;
      this.dataList = [];
    }
    QRCode.prototype = {
      addData: function(data) { this.dataList.push(data); },
      isDark: function(row, col) { return this.modules[row][col]; },
      getModuleCount: function() { return this.moduleCount; },
      make: function() {
        this.typeNumber = 5; // ขยายความจุเพื่อให้รองรับภาษาไทย + วันเวลาได้ครบ
        this.moduleCount = this.typeNumber * 4 + 17;
        
        this.modules = new Array(this.moduleCount);
        this.reserved = new Array(this.moduleCount);
        for (let row = 0; row < this.moduleCount; row++) {
          this.modules[row] = new Array(this.moduleCount).fill(false);
          this.reserved[row] = new Array(this.moduleCount).fill(false);
        }
        
        // วาดและล็อกพื้นที่ Finder Pattern ทั้ง 3 มุม (บนซ้าย, บนขวา, ล่างซ้าย)
        this.setupFinderPattern(0, 0);
        this.setupFinderPattern(this.moduleCount - 7, 0);
        this.setupFinderPattern(0, this.moduleCount - 7);

        // จองพื้นที่ Timing Pattern
        for (let r = 8; r < this.moduleCount - 8; r++) {
          this.reserved[r][6] = true;
          this.reserved[6][r] = true;
          this.modules[r][6] = (r % 2 === 0);
          this.modules[6][r] = (r % 2 === 0);
        }

        this.mapData(this.createDataBits());
      },
      setupFinderPattern: function(r, c) {
        for (let row = -1; row <= 7; row++) {
          if (r + row <= -1 || this.moduleCount <= r + row) continue;
          for (let col = -1; col <= 7; col++) {
            if (c + col <= -1 || this.moduleCount <= c + col) continue;
            
            // ล็อกพื้นที่ Finder Pattern + Separator สีขาวรอบๆ ห้ามให้ข้อมูลอื่นเขียนทับ
            this.reserved[r + row][c + col] = true;
            
            if (row >= 0 && row <= 6 && col >= 0 && col <= 6) {
              if ((row === 0 || row === 6 || col === 0 || col === 6) ||
                  (row >= 2 && row <= 4 && col >= 2 && col <= 4)) {
                this.modules[r + row][c + col] = true;
              } else {
                this.modules[r + row][c + col] = false;
              }
            } else {
              this.modules[r + row][c + col] = false;
            }
          }
        }
      },
      createDataBits: function() {
        let utf8Bytes = [];
        for (let i = 0; i < this.dataList.length; i++) {
          let str = this.dataList[i];
          for (let j = 0; j < str.length; j++) {
            let code = str.charCodeAt(j);
            if (code < 0x80) utf8Bytes.push(code);
            else if (code < 0x800) {
              utf8Bytes.push(0xc0 | (code >> 6));
              utf8Bytes.push(0x80 | (code & 0x3f));
            } else {
              utf8Bytes.push(0xe0 | (code >> 12));
              utf8Bytes.push(0x80 | ((code >> 6) & 0x3f));
              utf8Bytes.push(0x80 | (code & 0x3f));
            }
          }
        }
        return utf8Bytes;
      },
      mapData: function(data) {
        let inc = -1, row = this.moduleCount - 1, bitIndex = 7, byteIndex = 0;
        for (let col = this.moduleCount - 1; col > 0; col -= 2) {
          if (col === 6) col--;
          while (true) {
            for (let c = 0; c < 2; c++) {
              let currentCol = col - c;
              if (!this.reserved[row][currentCol]) {
                let dark = false;
                if (byteIndex < data.length) {
                  dark = (((data[byteIndex] >>> bitIndex) & 1) === 1);
                }
                this.modules[row][currentCol] = dark;
                bitIndex--;
                if (bitIndex === -1) { byteIndex++; bitIndex = 7; }
              }
            }
            row += inc;
            if (row < 0 || this.moduleCount <= row) {
              row -= inc; inc = -inc; break;
            }
          }
        }
      }
    };
    return {
      draw: function(canvas, text, size) {
        let qr = new QRCode(5);
        qr.addData(text);
        qr.make();
        let ctx = canvas.getContext('2d');
        let count = qr.getModuleCount();
        canvas.width = size;
        canvas.height = size;
        let tile = size / count;
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#000000';
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (qr.isDark(r, c)) {
              ctx.fillRect(Math.round(c * tile), Math.round(r * tile), Math.ceil(tile), Math.ceil(tile));
            }
          }
        }
      }
    };
  })();

  /* =========================================================
     ส่วนการจัดการข้อมูลบัตรนักศึกษา
  ========================================================= */
  let lockedIssueTime = '';

  window.onload = function() {
    const now = new Date();
    lockedIssueTime = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('input-issue-time').value = lockedIssueTime;
    updateCard();
  };

  function updateCard() {
    const name = document.getElementById('input-name').value || '-';
    const id = document.getElementById('input-id').value || '-';
    const faculty = document.getElementById('input-faculty').value || '-';
    const degree = document.getElementById('input-degree').value || '-';
    const status = document.getElementById('input-status').value || '-';

    document.getElementById('card-name').innerText = name;
    document.getElementById('card-id').innerText = id;
    document.getElementById('card-faculty').innerText = faculty;
    document.getElementById('card-degree').innerText = degree;
    document.getElementById('card-status').innerText = status;

    // สร้างข้อความลง QR Code
    const qrText = `ชื่อ-นามสกุล: ${name}\nรหัสนักศึกษา: ${id}\nเวลาที่ออกบัตร: ${lockedIssueTime}`;

    // วาด QR Code ลงบน Canvas
    const canvas = document.getElementById('qrcode-canvas');
    SimpleQR.draw(canvas, qrText, 85);
  }

  function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
      document.getElementById('card-img').src = reader.result;
    };
    if (event.target.files[0]) {
      reader.readAsDataURL(event.target.files[0]);
    }
  }

  function downloadCard() {
    const cardNode = document.getElementById('student-card');
    htmlToImage.toPng(cardNode)
      .then(function (dataUrl) {
        const link = document.createElement('a');
        link.download = 'student-card-mgmu.png';
        link.href = dataUrl;
        link.click();
      })
      .catch(function (error) {
        console.error('เกิดข้อผิดพลาดในการสร้างรูปภาพ:', error);
      });
  }
</script>

</body>
</html>
