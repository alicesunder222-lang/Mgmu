<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบทำบัตรนักศึกษา</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Sarabun', 'Segoe UI', sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .container { display: flex; gap: 40px; flex-wrap: wrap; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); align-items: flex-start; }
    
    /* ฝั่ง Form กรอกข้อมูล */
    .form-section { flex: 1; min-width: 300px; }
    .form-section h2 { color: #0b192c; margin-top: 0; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #334155; font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    
    .btn-download { width: 100%; padding: 14px; background-color: #f59e0b; color: #0b192c; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s; margin-top: 10px; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3); }
    .btn-download:hover { background-color: #d97706; }

    /* ฝั่งบัตรนักศึกษา (Navy Blue & Yellow Theme) */
    .preview-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    #student-card {
      width: 350px;
      height: 540px;
      background: linear-gradient(135deg, #0b192c 0%, #1e3e62 100%);
      border-radius: 16px;
      padding: 20px;
      color: white;
      position: relative;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      border: 3px solid #f59e0b;
      overflow: hidden;
    }

    /* โลโก้มหาวิทยาลัย mgmu.png วางมุมขวาบน */
    .card-logo {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 45px;
      height: 45px;
      object-fit: contain;
      z-index: 2;
    }

    .card-header { text-align: center; border-bottom: 2px solid #f59e0b; padding-bottom: 10px; margin-bottom: 15px; position: relative; z-index: 1; }
    .card-header h3 { margin: 0; color: #f59e0b; font-size: 18px; letter-spacing: 1px; padding-right: 35px; /* เว้นพื้นที่ไม่ให้ทับกับโลโก้ */ }
    .card-header p { margin: 2px 0 0 0; font-size: 10px; color: #cbd5e1; padding-right: 35px; }

    .card-body { text-align: center; position: relative; z-index: 1; }
    
    /* ช่องรูปถ่ายนักศึกษา (ไม่มีกรอบบังรูป) */
    .avatar-box {
      width: 110px;
      height: 140px;
      border: none;
      border-radius: 8px;
      margin: 0 auto 12px auto;
      overflow: hidden;
      background-color: #1e293b;
    }
    .avatar-box img { width: 100%; height: 100%; object-fit: cover; }

    .student-name { font-size: 17px; font-weight: bold; color: #ffffff; margin-bottom: 2px; }
    .student-id { font-size: 15px; color: #f59e0b; font-weight: bold; letter-spacing: 1px; margin-bottom: 12px; }
    
    .info-group { text-align: left; font-size: 12px; background: rgba(255,255,255,0.05); padding: 10px 14px; border-radius: 8px; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .info-label { color: #94a3b8; }
    .info-val { color: #ffffff; font-weight: 500; }

    .card-footer { position: absolute; bottom: 12px; left: 20px; right: 20px; text-align: center; font-size: 9px; color: #64748b; }
    .barcode { width: 70%; height: 25px; background: repeating-linear-gradient(90deg, #fff, #fff 2px, #000 2px, #000 4px); margin: 0 auto 4px auto; }
  </style>
</head>
<body>

<div class="container">
  <!-- ฝั่งกรอกข้อมูล -->
  <div class="form-section">
    <h2>กรอกข้อมูลบัตรนักศึกษา</h2>
    
    <div class="form-group">
      <label>รูปถ่ายนักศึกษา:</label>
      <input type="file" id="input-photo" accept="image/*" onchange="previewImage(event)">
    </div>
    
    <div class="form-group">
      <label>ชื่อ-นามสกุล:</label>
      <input type="text" id="input-name" value="นายสมชาย ใจดี" oninput="updateCard()">
    </div>
    
    <div class="form-group">
      <label>รหัสนักศึกษา:</label>
      <input type="text" id="input-id" value="6601002345" oninput="updateCard()">
    </div>
    
    <div class="form-group">
      <label>คณะ / สาขาวิชา:</label>
      <input type="text" id="input-faculty" value="วิศวกรรมศาสตร์" oninput="updateCard()">
    </div>
    
    <div class="form-group">
      <label>ระดับการศึกษา:</label>
      <select id="input-degree" onchange="updateCard()">
        <option value="ปริญญาตรี">ปริญญาตรี</option>
        <option value="ปริญญาโท">ปริญญาโท</option>
        <option value="ปริญญาเอก">ปริญญาเอก</option>
      </select>
    </div>

    <button class="btn-download" onclick="downloadCard()">💾 บันทึกบัตรเป็นรูปภาพ (PNG)</button>
  </div>

  <!-- ฝั่งแสดงบัตร (Live Preview) -->
  <div class="preview-section">
    <div id="student-card">
      
      <!-- โลโก้มหาวิทยาลัยมุมขวาบน -->
      <img src="mgmu.png" alt="University Logo" class="card-logo">

      <div class="card-header">
        <h3>MGMU UNIVERSITY</h3>
      
      </div>
      
      <div class="card-body">
        <div class="avatar-box">
          <img id="card-img" src="https://via.placeholder.com/110x140?text=PHOTO" alt="">
        </div>
        <div class="student-name" id="card-name">นายสมชาย ใจดี</div>
        <div class="student-id" id="card-id">6601002345</div>
        
        <div class="info-group">
          <div class="info-row"><span class="info-label">คณะ:</span><span class="info-val" id="card-faculty">วิศวกรรมศาสตร์</span></div>
          <div class="info-row"><span class="info-label">ระดับ:</span><span class="info-val" id="card-degree">ปริญญาตรี</span></div>
          <div class="info-row"><span class="info-label">สถานะ:</span><span class="info-val" style="color: #4ade80;">นักศึกษาปกติ</span></div>
        </div>
      </div>
      
      <div class="card-footer">
        <div class="barcode"></div>
        <span>บัตรประจำตัวนักศึกษา | STUDENT ID CARD</span>
      </div>
    </div>
  </div>
</div>

<script>
  // อัปเดตข้อความบนบัตร Real-time
  function updateCard() {
    document.getElementById('card-name').innerText = document.getElementById('input-name').value || 'ชื่อ-นามสกุล';
    document.getElementById('card-id').innerText = document.getElementById('input-id').value || 'X-XXXX-XXXXX';
    document.getElementById('card-faculty').innerText = document.getElementById('input-faculty').value || '-';
    document.getElementById('card-degree').innerText = document.getElementById('input-degree').value;
  }

  // พรีวิวรูปถ่าย
  function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
      const output = document.getElementById('card-img');
      output.src = reader.result;
    };
    if (event.target.files[0]) {
      reader.readAsDataURL(event.target.files[0]);
    }
  }

  // ดาวน์โหลดบัตรเป็น PNG
  function downloadCard() {
    const cardNode = document.getElementById('student-card');
    htmlToImage.toPng(cardNode)
      .then(function (dataUrl) {
        const link = document.createElement('a');
        link.download = 'student-card.png';
        link.href = dataUrl;
        link.click();
      })
      .catch(function (error) {
        console.error('เกิดข้อผิดพลาดในการสร้างรูปภาพ:', error);
      });
  }
</script>

</body>
</html>
